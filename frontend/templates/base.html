<!DOCTYPE html>
<html lang="en">
{% macro retry_icon() %}
<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.5 2.5V5h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 5.2A5.5 5.5 0 1 1 4.2 11.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
{% endmacro %}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ImageTransform{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head %}{% endblock %}
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="url(#brandGrad)" />
            <path d="M8 18L12 10L16 16L20 8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="28" y2="28">
                <stop stop-color="#8B5CF6" />
                <stop offset="1" stop-color="#6366F1" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">ImageTransform</span>
          <span class="brand-version">v1.0.0</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="/" class="nav-item{% if active_page == 'dashboard' %} active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a href="/new-job" class="nav-item{% if active_page == 'new_job' %} active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span data-i18n="nav.newJob">New Job</span>
        </a>
        <a href="/history" class="nav-item{% if active_page == 'history' %} active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span data-i18n="nav.history">History</span>
        </a>
        <a href="#" class="nav-item">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.93 4.93l1.41 1.41M13.66 13.66l1.41 1.41M4.93 15.07l1.41-1.41M13.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span data-i18n="nav.settings">Settings</span>
        </a>
      </nav>

      <div class="sidebar-job hidden" id="sidebarJob">
        <div class="sidebar-job-label" data-i18n="sidebar.processing">Processing</div>
        <div class="sidebar-job-title" id="sidebarJobTitle">Job #0000</div>
        <div class="sidebar-job-meta" id="sidebarJobMeta">0 / 0 images</div>
        <div class="progress-track progress-track-sm">
          <div class="progress-fill" id="sidebarProgressBar" style="width: 0%"></div>
        </div>
      </div>
    </aside>

    <div class="main-wrap">

      <header class="topbar">
        <div class="topbar-left">
          <a href="/new-job" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span data-i18n="topbar.newJob">New Job</span>
          </a>
          <button class="btn btn-secondary" type="button" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="4" y="3" width="3" height="10" rx="1" fill="currentColor"/><rect x="9" y="3" width="3" height="10" rx="1" fill="currentColor"/></svg>
            <span data-i18n="topbar.pause">Pause</span>
          </button>
        </div>
        <div class="topbar-right">
          <div class="lang-switcher" id="langSwitcher">
            <button class="lang-btn" type="button" id="langBtn" aria-haspopup="true" aria-expanded="false" data-i18n-aria="lang.switch">
              <svg class="lang-globe" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M2.5 10h15M10 2.5c2.2 2.8 2.7 5.5 2.7 7.5S12.2 17.2 10 17.5M10 2.5C7.8 5.3 7.3 8 7.3 10s.5 4.7 2.7 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span class="lang-code" id="langCode">EN</span>
            </button>
            <div class="lang-menu hidden" id="langMenu" role="menu">
              <button type="button" class="lang-option" data-lang="en" role="menuitemradio">English</button>
              <button type="button" class="lang-option" data-lang="ru" role="menuitemradio">Русский</button>
              <button type="button" class="lang-option" data-lang="ka" role="menuitemradio">ქართული</button>
            </div>
          </div>
        </div>
      </header>

      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/job_utils.js"></script>
  {% block scripts %}{% endblock %}
  <script src="/static/js/jobs.js"></script>
</body>
</html>
