services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      FLASK_DEBUG: "0"
      UPLOAD_FOLDER: tmp/uploads
      OUTPUT_FOLDER: tmp/outputs
    volumes:
      - app-data:/app/tmp
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  app-data:
